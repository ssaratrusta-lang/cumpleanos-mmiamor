<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz Cumpleaños Miammmor!</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
</head>
<body>

    <div class="escena">
        <!-- la checbox -->
        <input type="checkbox" id="abrir-sobre" class="toggle-sobre">

        <!-- boton por carta -->
        <label for="abrir-sobre" class="sobre" title="Haz clic para abrir o cerrar">
            <div class="solapa-superior"></div>
            <div class="solapas-laterales"></div>
            <div class="solapa-inferior"></div>
            <div class="sello-cera">🎂</div>
        </label>

        <!-- interna -->
        <article class="carta">
            <h1>¡Feliz Cumpleaños!</h1>
            <p>
                Que este nuevo año de vida esté lleno de alegría, salud, 
                momentos inolvidables y muchos sueños cumplidos. 
                ¡Disfruta tu día al máximo!
            </p>
            <div class="firma">Con todo mi cariño ❤️</div>
            
            <label for="abrir-sobre" class="btn-cerrar">Cerrar carta</label>
        </article>

        <!-- confeit -->
        <div class="confeti c1"></div>
        <div class="confeti c2"></div>
        <div class="confeti c3"></div>
        <div class="confeti c4"></div>
        <div class="confeti c5"></div>
        <div class="confeti c6"></div>
    </div>

</body>
</html>
